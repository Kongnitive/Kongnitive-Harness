services:
  edgemcp:
    build:
      context: .
      dockerfile: Dockerfile.edgemcp
    container_name: ros2-edgemcp
    network_mode: host
    working_dir: /ws
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/ws
      - edgemcp_node_scripts:/root/.kongnitive_ros2_edgemcp/nodes
    command: >
      bash -lc "
      source /opt/ros/humble/setup.bash &&
      pip3 install -e . &&
      python3 -m kongnitive_ros2_edgemcp.server
      "

volumes:
  edgemcp_node_scripts:

