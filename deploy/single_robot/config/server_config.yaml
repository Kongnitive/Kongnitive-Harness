server:
  name: "Kongnitive ROS2 EdgeMCP Robot A"
  transport: "stdio"
  log_level: "INFO"

nodes:
  script_dir: "~/.kongnitive_ros2_edgemcp/robot_a_nodes"
  max_nodes: 10

logging:
  buffer_size: 1000
  default_limit: 100

monitoring:
  status_interval: 1.0
  temperature_enabled: true

ros2:
  domain_id: 0
  executor_threads: 4
  namespace: "/robot_a"

episode:
  default_strategy: "hardcoded_v1"
  baseline_success_threshold: 0.95
  max_randomized_runs: 200

